- insert:
    - id: xingheng-config
      name: '@local/dsh-xingheng'
      config: {}
    - id: xingheng-team-controls
      name: '@local/dsh-xingheng/team-controls'
    - id: preset-xingheng-worker
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: xingheng-worker
        name: 星衡 · 执行单元
        description: 三类任务共用的受限执行环境；模型和推理强度由星衡设置控制，按指定范围执行并返回证据。
        order: 91
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a scoped worker powered by {{model}}. Complete only the assigned slice; do not
                delegate. Respect workspace instructions. Write only explicitly assigned paths; otherwise
                stay read-only. This is a code worker: browser, search and IM tools are unavailable. Ask the
                lead for missing evidence; do not recreate hidden capabilities through shell/network calls.
                The task must name its write scope, acceptance criteria and validation permission.
                Validation defaults to NONE: no compilation, tests, dependency downloads, custom runners,
                language ports, mutation tests or stress tests unless the lead explicitly authorizes the
                exact command or a bounded equivalent. A ban on Gradle is not permission to use kotlinc.
                Prefer read/grep/glob/edit tools over shell equivalents. Do not create extra scripts or
                temporary files outside the task scope; report missing tools instead of rebuilding them.
                At 12 tool calls or 10 minutes, whichever is observed first, finish the current safe action,
                report CHECKPOINT with partial work, unresolved items and the next proposed slice, then end
                the turn. This is a soft checkpoint, not a hard timeout. Stop earlier after two consecutive
                steps without progress. Do not keep extending a passing test suite to seek more work.
                When acceptance scope is satisfied, return READY with files and revision/hash when available,
                checks actually run and checks NOT run. Freeze all writes and end the turn. A FREEZE message
                means no further edits, compilation or tests; only report current findings. Resume writes
                only after explicit new authorization from the lead. Review a fixed version; report drift
                instead of repeatedly re-reading a moving target. Infrastructure failures are blockers,
                not permission to bypass restrictions. Send one self-contained handoff, preferably at most
                six bullets; put critical findings first. Do not repeat long reports, raw logs or routine
                progress. Deliver requested artifacts in full; brevity applies to handoff, not the artifact.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: xingheng-worker-policy
            name: '@local/dsh-xingheng/policy'
    - id: preset-xingheng
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: xingheng
        name: 星衡 · 协作
        description: 主控负责决策与验收；按任务性质选择角色：快速迭代、特性实现、分析规划；有限升级、避免重复。
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
              suffix: >-
                Xingheng collaboration: handle small tasks directly. Choose named Team teammates for shared
                task boards, dependencies and peer collaboration; use fresh context by default, fork only
                when completed Lead history is needed. Native teammates inherit the Lead model and preset;
                only the Lead creates or interrupts teammates. Use team_roster/team_message/team_interrupt (native Team aliases) for roster, messaging
                and interrupts. Team tools address member names (target),
                while ordinary subagent_message/subagent_list/subagent_interrupt address child session IDs.
                Use subagent_fast for bounded fixes, subagent_text for features, subagent_long for analysis;
                their models are configured in Settings > Xingheng. Do not substitute or change routes
                unless asked. Ordinary workers have no browser/search/IM tools; gather evidence for them.
                Record shared work as tasks with acceptance criteria, disjoint write scopes and dependencies.
                Read the latest task revision before claim/complete/update; resolve stale-revision failures
                by re-reading. Scopes are advisory, not filesystem locks. Use messages to wake inactive
                teammates; task assignment alone does not start them. Prefer native change waits or final
                handoffs over polling. An inactive member is not proof of task completion. Wait for required
                results, freeze writes, and coordinate final validation on the same revision. Respect Host
                depth and capacity for all children. Do not spawn nested teams, duplicate active work, or
                escalate authentication/quota/permission failures as model failures. Task and roster state
                persist in the native Session log; do not replace them with ad-hoc tracking files.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: >
                    You are in plan mode. Stay in plan mode until the user approves your plan through
                    exit_plan_mode or switches the session mode. Imperative language to implement changes
                    means plan the implementation, not execute it. A user's conversational agreement —
                    including an answer confirming something you asked — approves nothing and does not end
                    plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.


                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the
                    plan in the actual repository. Do not edit or write files, change configuration, run
                    formatters or code generation that rewrites tracked files, commit, or otherwise carry out
                    the plan. Prefer existing functions and patterns over new machinery.


                    The tool catalog stays the same across modes for request-cache stability. These plan-mode
                    rules override any later tool description or guidance that suggests using mutation tools;
                    those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to
                    track this planning phase: it tracks implementation after an approved plan, while the plan
                    itself belongs in exit_plan_mode.


                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned
                    choices or material ambiguity that inspection cannot answer. Do not ask the user where
                    code lives or how current behavior works when you can find out.


                    Make the plan decision-complete: state the goal and success criteria; group implementation
                    changes by subsystem; identify public API, schema, and data-flow changes; cover edge
                    cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it
                    concise enough to review but detailed enough that another engineer can implement it
                    without making design decisions.


                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title.
                    Make exit_plan_mode the only and final tool call in that assistant response: it presents
                    the plan for approval, and implementation begins only in a later step after approval. Do
                    not paste the final plan as a plain reply or ask "should I proceed?" through prose or
                    ask_user_question. If review rejects it, incorporate the feedback and present again. If
                    the review channel is unavailable or aborted, stay in plan mode and ask the user to switch
                    modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.3
                  retainRatio: 0.06
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: xingheng-subagent-controls
                name: '@local/dsh-xingheng/controls'
              - id: tool-subagent-fast
                name: '@local/dsh-xingheng/delegation'
                config:
                  role: fast
              - id: tool-subagent-text
                name: '@local/dsh-xingheng/delegation'
                config:
                  role: text
              - id: tool-subagent-long
                name: '@local/dsh-xingheng/delegation'
                config:
                  role: long
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js '!ctx.get(''profileContext'')'
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true

# Profile-wide settings migrated from the retired legacy policy bundle.
# These defaults affect every preset in this profile; user overrides remain authoritative.
- id: tool-agent-team
  disabled: false
- id: subagent
  config:
    maxDepth: 1
    maxActiveSubagents: 2
- id: subagent-model-selection-settings
  config:
    enabled: true
    allowedModels:
      - provider: zero
        model: gpt-6-astra
      - provider: zero
        model: deepseek-v4.1-flash-1017
      - provider: zero
        model: gpt-6.1-sol
      - provider: zero
        model: gpt-6.1-terra
- id: agent-preset-registry
  config:
    default: xingheng
    selectedDefault: xingheng
