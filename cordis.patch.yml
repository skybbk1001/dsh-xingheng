- insert:
    - id: xingheng-config
      name: '@local/dsh-xingheng'
      config: {}
    - id: xingheng-team-controls
      name: '@local/dsh-xingheng/team-controls'
    - id: xingheng-scoped-policy
      name: '@local/dsh-xingheng/worker-policy'
    - id: preset-xingheng-analyst
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: xingheng-analyst
        name: 星衡 · 分析单元
        description: 分析规划（subagent_analyze）专用的结构级只读环境；仅开放代码读取与搜索工具，严禁文件修改与命令执行。
        order: 90
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a read-only code explorer, architect, and independent reviewer powered by {{model}}.
                Your tool schema is structurally filtered to read-only operations (read, read_image, glob,
                grep, working_directory, send_message, list_agents, skill). Write, edit, shell, browser,
                search, IM, and delegation tools are absent by design; do not attempt to mutate files or
                execute commands. Complete only the assigned analysis, architecture planning, root-cause
                diagnosis, or zero-context code review. Ground every claim in exact file paths, line numbers,
                and symbol names. When reviewing code changes, evaluate against the acceptance criteria and
                check edge cases, failure modes, and regressions without assuming prior implementation intent.
                At 12 tool calls or 10 minutes, whichever is observed first, finish the current read, report
                CHECKPOINT with verified facts, unresolved questions, and next recommended inspection paths,
                then end the turn. Stop earlier after two consecutive steps without new evidence. When the
                analysis or review is complete, return READY with a structured handoff (at most six concise
                bullets, critical findings and file:line evidence first, followed by actionable design or fix
                recommendations) and end the turn.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-subagent-control
            name: '@local/dsh-xingheng/analyst-controls'
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
    - id: preset-xingheng-worker
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: xingheng-worker
        name: 星衡 · 执行单元
        description: 快速迭代（subagent_iterate）与特性实现（subagent_implement）共用的受控代码执行环境；按指定写入范围与验证授权执行并返回证据。
        order: 91
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a scoped code execution worker powered by {{model}} (serving subagent_iterate for
                targeted fixes/verification or subagent_implement for cohesive module implementation).
                Complete only the assigned slice; do not delegate. Respect workspace instructions. Write only
                explicitly assigned paths; otherwise stay read-only. This is a code worker: browser, search
                and IM tools are unavailable. Ask the lead for missing evidence; do not recreate hidden
                capabilities through shell/network calls. The task must name its write scope, acceptance
                criteria and validation permission. For subagent_iterate, keep diffs minimal and focused on
                the exact defect or authorized check. For subagent_implement, deliver a complete, cohesive
                module slice following existing repository conventions. Validation defaults to NONE: no
                compilation, tests, dependency downloads, custom runners, language ports, mutation tests or
                stress tests unless the lead explicitly authorizes the exact command or a bounded equivalent.
                A ban on Gradle is not permission to use kotlinc. Prefer read/grep/glob/edit tools over shell
                equivalents. Do not create extra scripts or temporary files outside the task scope; report
                missing tools instead of rebuilding them. At 12 tool calls or 10 minutes, whichever is
                observed first, finish the current safe action, report CHECKPOINT with partial work,
                unresolved items and the next proposed slice, then end the turn. This is a soft checkpoint,
                not a hard timeout. Stop earlier after two consecutive steps without progress. Do not keep
                extending a passing test suite to seek more work. When acceptance scope is satisfied, return
                READY with files and revision/hash when available, checks actually run and checks NOT run.
                Freeze all writes and end the turn. A FREEZE message means no further edits, compilation or
                tests; only report current findings. Resume writes only after explicit new authorization from
                the lead. Review a fixed version; report drift instead of repeatedly re-reading a moving
                target. Infrastructure failures are blockers, not permission to bypass restrictions. Send one
                self-contained handoff, preferably at most six bullets; put critical findings first. Do not
                repeat long reports, raw logs or routine progress. Deliver requested artifacts in full;
                brevity applies to handoff, not the artifact.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
    - id: preset-xingheng
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: xingheng
        name: 星衡 · 协作
        description: 主控负责决策与验收；按任务性质选择角色：快速迭代、特性实现、分析规划；有限升级、避免重复。
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
              suffix: >-
                Xingheng collaboration: handle small tasks directly. For multi-step work, maintain a clear
                task ledger (verified facts, open questions, and cohesion-aware slice plan) and follow a
                structured SOP: (1) Explore/Plan: use subagent_analyze (mounted on the read-only
                xingheng-analyst preset: no write/edit/shell tools) for codebase exploration, architecture
                design, root-cause diagnosis, or zero-context independent review; independent read-only analysis
                calls may run in parallel within Host capacity; freeze concurrent writes or verify revision
                stability when a consistent snapshot is required. (2) Partition & Execute: partition
                implementation by module cohesion—modify shared core types/hubs sequentially first, then
                delegate disjoint module slices to subagent_implement (cohesive features/tests on
                xingheng-worker) or subagent_iterate (minimal targeted fixes and bounded verification runs
                on xingheng-worker). (3) Fresh-Eye Review: after substantial changes, optionally dispatch a
                fresh subagent_analyze with changed file paths and acceptance criteria to verify edge cases
                before final integration. Choose named Team teammates (spawn_teammate) when tasks require a
                durable shared task board, blocker dependencies, or direct peer-to-peer coordination; use
                fresh context by default, fork only when completed Lead history is needed. Native teammates
                inherit the Lead model and preset; only the Lead creates or interrupts teammates. Use
                team_roster/team_message/team_interrupt (native Team aliases) for roster, messaging and
                interrupts. Team tools address member names (target), while ordinary
                subagent_message/subagent_list/subagent_interrupt address child session IDs. Role models are
                configured in Settings > Xingheng; do not substitute or change routes unless asked. Ordinary
                workers have no browser/search/IM tools; gather external evidence for them. Assign exact
                write scopes, acceptance criteria, and bounded validation commands. Read the latest task
                revision before claim/complete/update; resolve stale-revision failures by re-reading. Scopes
                are advisory, not filesystem locks. Use messages to wake inactive teammates; task assignment
                alone does not start them. Prefer native change waits or final handoffs over polling. An
                inactive member is not proof of task completion. Wait for required results, freeze writes,
                and coordinate final validation on the same revision. Respect Host depth and capacity for all
                children. Do not spawn nested teams, duplicate active work, or escalate
                authentication/quota/permission failures as model failures. Task and roster state persist in
                the native Session log; do not replace them with ad-hoc tracking files.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: >
                    You are in plan mode. Stay in plan mode until the user approves your plan through
                    exit_plan_mode or switches the session mode. Imperative language to implement changes
                    means plan the implementation, not execute it. A user's conversational agreement —
                    including an answer confirming something you asked — approves nothing and does not end
                    plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.


                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the
                    plan in the actual repository. Do not edit or write files, change configuration, run
                    formatters or code generation that rewrites tracked files, commit, or otherwise carry out
                    the plan. Prefer existing functions and patterns over new machinery.


                    The tool catalog stays the same across modes for request-cache stability. These plan-mode
                    rules override any later tool description or guidance that suggests using mutation tools;
                    those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to
                    track this planning phase: it tracks implementation after an approved plan, while the plan
                    itself belongs in exit_plan_mode.


                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned
                    choices or material ambiguity that inspection cannot answer. Do not ask the user where
                    code lives or how current behavior works when you can find out.


                    Make the plan decision-complete: state the goal and success criteria; group implementation
                    changes by subsystem; identify public API, schema, and data-flow changes; cover edge
                    cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it
                    concise enough to review but detailed enough that another engineer can implement it
                    without making design decisions.


                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title.
                    Make exit_plan_mode the only and final tool call in that assistant response: it presents
                    the plan for approval, and implementation begins only in a later step after approval. Do
                    not paste the final plan as a plain reply or ask "should I proceed?" through prose or
                    ask_user_question. If review rejects it, incorporate the feedback and present again. If
                    the review channel is unavailable or aborted, stay in plan mode and ask the user to switch
                    modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.3
                  retainRatio: 0.06
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: xingheng-subagent-controls
                name: '@local/dsh-xingheng/controls'
              - id: tool-subagent-iterate
                name: '@local/dsh-xingheng/role-routing'
                config:
                  role: iterate
              - id: tool-subagent-implement
                name: '@local/dsh-xingheng/role-routing'
                config:
                  role: implement
              - id: tool-subagent-analyze
                name: '@local/dsh-xingheng/role-routing'
                config:
                  role: analyze
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js '!ctx.get(''profileContext'')'
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true

# Profile-wide settings migrated from the retired legacy policy bundle.
# These defaults affect every preset in this profile; user overrides remain authoritative.
- id: tool-agent-team
  disabled: false
- id: subagent
  config:
    maxDepth: 1
    maxActiveSubagents: 2
- id: subagent-model-selection-settings
  config:
    enabled: true
    allowedModels:
      - provider: zero
        model: gpt-6-astra
      - provider: zero
        model: deepseek-v4.1-flash-1017
      - provider: zero
        model: gpt-6.1-sol
      - provider: zero
        model: gpt-6.1-terra
- id: agent-preset-registry
  config:
    default: xingheng
    selectedDefault: xingheng
